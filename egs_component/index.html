<!doctype html>
<!--
  Browser eye recorder for the Eye-Gaming Study (Streamlit custom component, no build step).
  Runs Google MediaPipe Face Landmarker in the participant's browser and sends back ONLY numbers per frame:
  time, face found, eye aspect ratio (EAR; Soukupova & Cech, 2016) and MediaPipe's eye-blink score.
  The video never leaves the participant's device.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: "Source Sans Pro", sans-serif; color: var(--text, #31333f); background: transparent; }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  video { width: 320px; max-width: 100%; border-radius: 8px; transform: scaleX(-1); background: #000; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); cursor: pointer;
           background: #ff4b4b; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin: 8px 0; }
  .bar { height: 8px; background: rgba(128,128,128,.25); border-radius: 4px; width: 320px; max-width: 100%; }
  .bar > div { height: 8px; background: #1c83e1; border-radius: 4px; width: 0; }
</style>
</head>
<body>
<div class="row">
  <video id="video" playsinline muted></video>
  <div>
    <div id="status">Press <b>Start camera</b>. The browser will ask for permission to use the webcam.</div>
    <button id="cam">Start camera</button>
    <button id="rec" disabled>⏺️ Start recording</button>
    <div style="height:10px"></div>
    <div class="bar"><div id="prog"></div></div>
  </div>
</div>
<script type="module">
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const LEFT = [362, 385, 387, 263, 373, 380], RIGHT = [33, 160, 158, 133, 153, 144];

// ── minimal Streamlit component protocol ──
const send = (type, data) => window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
const setHeight = () => send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 10 });
let args = { seconds: 60 };
window.addEventListener("message", e => {
  if (e.data && e.data.type === "streamlit:render") { args = e.data.args || args; setHeight(); }
});
send("streamlit:componentReady", { apiVersion: 1 });

const $ = id => document.getElementById(id);
const video = $("video"), status = $("status");
let landmarker = null, stream = null, recording = false, frames = [], t0 = 0, lastFaceOk = false;

function ear(lm, idx, w, h) {
  const p = idx.map(i => [lm[i].x * w, lm[i].y * h]);
  const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  return (d(p[1], p[5]) + d(p[2], p[4])) / (2 * d(p[0], p[3]));
}

function loop() {
  if (!stream) return;
  if (video.readyState >= 2) {
    const now = performance.now();
    const r = landmarker.detectForVideo(video, now);
    const w = video.videoWidth, h = video.videoHeight;
    let ok = false, e = null, blink = null;
    if (r.faceLandmarks && r.faceLandmarks.length) {
      const lm = r.faceLandmarks[0];
      const iod = Math.hypot((lm[33].x - lm[263].x) * w, (lm[33].y - lm[263].y) * h);
      ok = iod >= 40;                                    // eyes big enough to measure
      e = (ear(lm, LEFT, w, h) + ear(lm, RIGHT, w, h)) / 2;
      const c = r.faceBlendshapes[0].categories;
      blink = (c.find(x => x.categoryName === "eyeBlinkLeft").score + c.find(x => x.categoryName === "eyeBlinkRight").score) / 2;
    }
    lastFaceOk = ok;
    if (recording) {
      const t = (now - t0) / 1000;
      frames.push([+t.toFixed(3), ok ? 1 : 0, ok ? +e.toFixed(4) : null, ok ? +blink.toFixed(3) : null]);
      $("prog").style.width = Math.min(100, t / args.seconds * 100) + "%";
      status.textContent = `Recording… ${Math.max(0, Math.ceil(args.seconds - t))} s left — keep reading the text.` +
                           (ok ? "" : "  ⚠️ Face not visible");
      if (t >= args.seconds) return finish();
    } else {
      status.textContent = ok ? "✅ Face and eyes found — ready to record." : "Move so your whole face is visible and closer to the camera.";
      $("rec").disabled = !ok;
    }
  }
  requestAnimationFrame(loop);
}

function finish() {
  recording = false;
  stream.getTracks().forEach(t => t.stop());
  stream = null;
  status.textContent = "✅ Recording finished — the camera is off.";
  $("rec").disabled = true;
  $("cam").disabled = false;
  send("streamlit:setComponentValue", { value: { frames, width: video.videoWidth, height: video.videoHeight,
       seconds: args.seconds, done_at: Date.now() }, dataType: "json" });
}

$("cam").onclick = async () => {
  $("cam").disabled = true;
  try {
    status.textContent = "Loading the face model (first time can take ~10 s)…";
    if (!landmarker) {
      const { FaceLandmarker, FilesetResolver } = await import(MP + "/vision_bundle.mjs");
      const files = await FilesetResolver.forVisionTasks(MP + "/wasm");
      landmarker = await FaceLandmarker.createFromOptions(files, {
        baseOptions: { modelAssetPath: MODEL, delegate: "CPU" }, runningMode: "VIDEO", numFaces: 1,
        outputFaceBlendshapes: true });
    }
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
    video.srcObject = stream;
    await video.play();
    setHeight();
    requestAnimationFrame(loop);
  } catch (err) {
    status.textContent = "⚠️ Could not start the camera: " + err.message +
      ". Allow camera access in the browser (padlock icon in the address bar) and try again.";
    $("cam").disabled = false;
  }
};

$("rec").onclick = () => {
  frames = []; t0 = performance.now(); recording = true;
  $("rec").disabled = true;
};
setHeight();
</script>
</body>
</html>
